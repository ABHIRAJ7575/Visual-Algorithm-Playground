<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Algorithm Playground</title>

<style>
    :root {
        --bg: #0c0c0f;
        --surface: #13131a;
        --accent: #b44cff;
        --accent-light: #d28aff;
        --text: #ffffff;
        --text-dim: #999;
        --success: #4cff6e;
        --compare: #ffb84c;
        --swap: #ff4c4c;
        --path: #4c9fff;
        --wall: #2d2d3a;
        --start: #4cff6e;
        --end: #ff4c4c;
        --visited: #7d4cff;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
    }

    body {
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        gap: 15px;
        padding: 20px;
        overflow-x: hidden;
    }

    h1 {
        text-align: center;
        font-size: 28px;
        background: linear-gradient(135deg, var(--accent), var(--accent-light));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
    }

    .tabs {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .tab {
        padding: 12px 24px;
        background: var(--surface);
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        transition: all 0.3s;
        border: 2px solid transparent;
    }
    .tab.active {
        border-color: var(--accent);
        background: rgba(180, 76, 255, 0.1);
        color: var(--accent-light);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(180, 76, 255, 0.3);
    }

    .controls {
        display: flex;
        gap: 10px;
        padding: 15px;
        background: var(--surface);
        border-radius: 10px;
        justify-content: center;
        flex-wrap: wrap;
        border: 1px solid rgba(180, 76, 255, 0.2);
    }
    
    .controls button, .controls select, .controls input {
        padding: 10px 16px;
        background: var(--surface);
        color: var(--text);
        border: 2px solid var(--accent);
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 14px;
    }
    
    .controls button:hover:not(:disabled) {
        background: var(--accent);
        color: var(--bg);
        transform: scale(1.05);
    }
    
    .controls button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .controls input[type="range"] {
        width: 150px;
        cursor: pointer;
    }

    .speed-label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-dim);
        font-size: 13px;
    }

    .stats {
        display: flex;
        gap: 20px;
        padding: 12px;
        background: var(--surface);
        border-radius: 10px;
        justify-content: center;
        border: 1px solid rgba(180, 76, 255, 0.2);
        flex-wrap: wrap;
    }

    .stat-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
    }

    .stat-label {
        font-size: 12px;
        color: var(--text-dim);
    }

    .stat-value {
        font-size: 20px;
        font-weight: bold;
        color: var(--accent-light);
    }

    #visualizer {
        width: 100%;
        min-height: 450px;
        background: var(--surface);
        border-radius: 12px;
        display: flex;
        align-items: end;
        justify-content: center;
        padding: 20px;
        overflow: hidden;
        border: 1px solid rgba(180, 76, 255, 0.2);
        position: relative;
    }

    .bar {
        width: 18px;
        margin: 1px;
        background: linear-gradient(180deg, var(--accent-light), var(--accent));
        transition: all 0.15s ease;
        border-radius: 4px 4px 0 0;
        position: relative;
        box-shadow: 0 2px 8px rgba(180, 76, 255, 0.3);
    }

    .bar.comparing {
        background: linear-gradient(180deg, var(--compare), #ff8c1a);
        transform: scaleX(1.2);
    }

    .bar.swapping {
        background: linear-gradient(180deg, var(--swap), #cc0000);
        transform: translateY(-10px);
    }

    .bar.sorted {
        background: linear-gradient(180deg, var(--success), #2ecc4e);
    }

    .search-container {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: center;
    }

    .search-item {
        width: 55px;
        height: 55px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent-light), var(--accent));
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 18px;
        transition: all 0.3s;
        box-shadow: 0 4px 12px rgba(180, 76, 255, 0.3);
    }

    .search-item.checking {
        background: linear-gradient(135deg, var(--compare), #ff8c1a);
        transform: scale(1.3);
        box-shadow: 0 6px 20px rgba(255, 140, 26, 0.5);
    }

    .search-item.found {
        background: linear-gradient(135deg, var(--success), #2ecc4e);
        transform: scale(1.4);
        box-shadow: 0 8px 24px rgba(76, 255, 110, 0.6);
        animation: pulse 0.5s infinite;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1.4); }
        50% { transform: scale(1.5); }
    }

    .grid {
        display: grid;
        gap: 1px;
        justify-content: center;
    }
    
    .cell {
        width: 20px;
        height: 20px;
        background: #1d1d26;
        border-radius: 2px;
        cursor: pointer;
        transition: all 0.2s;
    }

    .cell.wall {
        background: var(--wall);
        border: 1px solid #3d3d4a;
    }

    .cell.start {
        background: var(--start);
        box-shadow: 0 0 10px var(--start);
    }

    .cell.end {
        background: var(--end);
        box-shadow: 0 0 10px var(--end);
    }

    .cell.visited {
        background: var(--visited);
        animation: fadeIn 0.3s;
    }

    .cell.path {
        background: var(--path);
        animation: pathReveal 0.3s;
    }

    @keyframes fadeIn {
        from { transform: scale(0.3); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    @keyframes pathReveal {
        from { transform: scale(0.5); }
        to { transform: scale(1); }
    }

    .info-text {
        text-align: center;
        color: var(--text-dim);
        font-size: 13px;
        margin-top: -10px;
    }

    .complexity-info {
        text-align: center;
        padding: 10px;
        background: var(--surface);
        border-radius: 8px;
        border: 1px solid rgba(180, 76, 255, 0.2);
        font-size: 13px;
        color: var(--text-dim);
    }

    .complexity-info strong {
        color: var(--accent-light);
    }
</style>

</head>
<body>

<h1> Visual Algorithm Playground</h1>

<div class="tabs">
    <div class="tab active" data-tab="sorting">📊 Sorting</div>
    <div class="tab" data-tab="searching">🔍 Searching</div>
    <div class="tab" data-tab="pathfinding">🗺️ Pathfinding</div>
</div>

<div class="controls">
    <select id="algorithmSelect">
        <option value="bubble">Bubble Sort</option>
        <option value="selection">Selection Sort</option>
        <option value="insertion">Insertion Sort</option>
        <option value="merge">Merge Sort</option>
        <option value="quick">Quick Sort</option>
    </select>
    <button id="generateData">🔄 Generate New</button>
    <button id="playBtn">▶️ Play</button>
    <button id="pauseBtn" disabled>⏸️ Pause</button>
    <button id="resetBtn">🔁 Reset</button>
    <div class="speed-label">
        Speed: <input type="range" id="speedSlider" min="1" max="100" value="50">
    </div>
</div>

<div class="stats">
    <div class="stat-item">
        <div class="stat-label">Comparisons</div>
        <div class="stat-value" id="comparisons">0</div>
    </div>
    <div class="stat-item">
        <div class="stat-label">Swaps/Moves</div>
        <div class="stat-value" id="swaps">0</div>
    </div>
    <div class="stat-item">
        <div class="stat-label">Time (ms)</div>
        <div class="stat-value" id="time">0</div>
    </div>
</div>

<div class="complexity-info" id="complexity">
    Select an algorithm and click Play to visualize it!
</div>

<div id="visualizer"></div>

<div class="info-text" id="infoText"></div>

<script>
let currentTab = "sorting";
let isPlaying = false;
let isPaused = false;
let animationSpeed = 50;
let stats = { comparisons: 0, swaps: 0, startTime: 0 };
let arrayData = [];
let searchTarget = null;
let gridData = [];
let gridRows = 25, gridCols = 40;
let startCell = null, endCell = null;
let isDrawing = false;

const complexityInfo = {
    bubble: "Time: O(n²) | Space: O(1) | Stable: Yes",
    selection: "Time: O(n²) | Space: O(1) | Stable: No",
    insertion: "Time: O(n²) | Space: O(1) | Stable: Yes",
    merge: "Time: O(n log n) | Space: O(n) | Stable: Yes",
    quick: "Time: O(n log n) avg | Space: O(log n) | Stable: No",
    linear: "Time: O(n) | Space: O(1)",
    binary: "Time: O(log n) | Space: O(1)",
    bfs: "Time: O(V + E) | Space: O(V)",
    dfs: "Time: O(V + E) | Space: O(V)"
};

document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentTab = tab.dataset.tab;
        resetStats();
        loadVisualizer();
    });
});

document.getElementById("speedSlider").addEventListener("input", (e) => {
    animationSpeed = parseInt(e.target.value);
});

document.getElementById("generateData").addEventListener("click", () => {
    resetStats();
    loadVisualizer();
});

document.getElementById("playBtn").addEventListener("click", async () => {
    if (!isPlaying) {
        isPlaying = true;
        isPaused = false;
        document.getElementById("playBtn").disabled = true;
        document.getElementById("pauseBtn").disabled = false;
        document.getElementById("generateData").disabled = true;
        stats.startTime = Date.now();
        
        if (currentTab === "sorting") {
            await runSortingAlgorithm();
        } else if (currentTab === "searching") {
            await runSearchingAlgorithm();
        } else if (currentTab === "pathfinding") {
            await runPathfinding();
        }
        
        isPlaying = false;
        document.getElementById("playBtn").disabled = false;
        document.getElementById("pauseBtn").disabled = true;
        document.getElementById("generateData").disabled = false;
    }
});

document.getElementById("pauseBtn").addEventListener("click", () => {
    isPaused = !isPaused;
    document.getElementById("pauseBtn").textContent = isPaused ? "▶️ Resume" : "⏸️ Pause";
});

document.getElementById("resetBtn").addEventListener("click", () => {
    isPaused = false;
    isPlaying = false;
    resetStats();
    loadVisualizer();
    document.getElementById("playBtn").disabled = false;
    document.getElementById("pauseBtn").disabled = true;
    document.getElementById("generateData").disabled = false;
});

function resetStats() {
    stats = { comparisons: 0, swaps: 0, startTime: 0 };
    updateStats();
}

function updateStats() {
    document.getElementById("comparisons").textContent = stats.comparisons;
    document.getElementById("swaps").textContent = stats.swaps;
    document.getElementById("time").textContent = stats.startTime ? Date.now() - stats.startTime : 0;
}

async function sleep(ms) {
    const delay = Math.max(1, 101 - animationSpeed) * (ms / 50);
    while (isPaused) await new Promise(r => setTimeout(r, 100));
    return new Promise(resolve => setTimeout(resolve, delay));
}

function loadVisualizer() {
    const vis = document.getElementById("visualizer");
    const algo = document.getElementById("algorithmSelect");
    const info = document.getElementById("infoText");
    const complexity = document.getElementById("complexity");
    
    vis.innerHTML = "";
    info.textContent = "";
    
    if (currentTab === "sorting") {
        algo.innerHTML = `
            <option value="bubble">Bubble Sort</option>
            <option value="selection">Selection Sort</option>
            <option value="insertion">Insertion Sort</option>
            <option value="merge">Merge Sort</option>
            <option value="quick">Quick Sort</option>
        `;
        generateBars();
        complexity.innerHTML = `<strong>${algo.value.charAt(0).toUpperCase() + algo.value.slice(1)} Sort:</strong> ${complexityInfo[algo.value]}`;
    } else if (currentTab === "searching") {
        algo.innerHTML = `
            <option value="linear">Linear Search</option>
            <option value="binary">Binary Search</option>
        `;
        generateSearchItems();
        info.textContent = "Target number will be randomly selected";
        complexity.innerHTML = `<strong>${algo.value.charAt(0).toUpperCase() + algo.value.slice(1)} Search:</strong> ${complexityInfo[algo.value]}`;
    } else if (currentTab === "pathfinding") {
        algo.innerHTML = `
            <option value="bfs">Breadth-First Search</option>
            <option value="dfs">Depth-First Search</option>
        `;
        generateGrid();
        info.textContent = "Click to draw walls | Green = Start | Red = End";
        complexity.innerHTML = `<strong>${algo.value.toUpperCase()}:</strong> ${complexityInfo[algo.value]}`;
    }
    
    algo.addEventListener("change", () => {
        complexity.innerHTML = `<strong>${algo.options[algo.selectedIndex].text}:</strong> ${complexityInfo[algo.value]}`;
    });
}

function generateBars() {
    const vis = document.getElementById("visualizer");
    vis.style.display = "flex";
    vis.style.alignItems = "end";
    arrayData = [];
    
    for (let i = 0; i < 40; i++) {
        const h = Math.floor(Math.random() * 350) + 50;
        arrayData.push(h);
        const bar = document.createElement("div");
        bar.classList.add("bar");
        bar.style.height = h + "px";
        vis.append(bar);
    }
}

function generateSearchItems() {
    const vis = document.getElementById("visualizer");
    vis.style.display = "flex";
    vis.style.alignItems = "center";
    
    const container = document.createElement("div");
    container.classList.add("search-container");
    arrayData = [];
    
    for (let i = 0; i < 15; i++) {
        const val = Math.floor(Math.random() * 99) + 1;
        arrayData.push(val);
        const item = document.createElement("div");
        item.classList.add("search-item");
        item.textContent = val;
        container.append(item);
    }
    
    vis.append(container);
    searchTarget = arrayData[Math.floor(Math.random() * arrayData.length)];
}

function generateGrid() {
    const vis = document.getElementById("visualizer");
    vis.style.display = "block";
    
    const grid = document.createElement("div");
    grid.classList.add("grid");
    grid.style.gridTemplateColumns = `repeat(${gridCols}, 20px)`;
    
    gridData = Array(gridRows).fill().map(() => Array(gridCols).fill(0));
    startCell = { row: Math.floor(gridRows / 2), col: 5 };
    endCell = { row: Math.floor(gridRows / 2), col: gridCols - 6 };
    
    for (let r = 0; r < gridRows; r++) {
        for (let c = 0; c < gridCols; c++) {
            const cell = document.createElement("div");
            cell.classList.add("cell");
            cell.dataset.row = r;
            cell.dataset.col = c;
            
            if (r === startCell.row && c === startCell.col) {
                cell.classList.add("start");
                gridData[r][c] = 2;
            } else if (r === endCell.row && c === endCell.col) {
                cell.classList.add("end");
                gridData[r][c] = 3;
            }
            
            cell.addEventListener("mousedown", () => {
                isDrawing = true;
                toggleWall(cell);
            });
            cell.addEventListener("mouseenter", () => {
                if (isDrawing) toggleWall(cell);
            });
            
            grid.append(cell);
        }
    }
    
    document.addEventListener("mouseup", () => { isDrawing = false; });
    vis.append(grid);
}

function toggleWall(cell) {
    const r = parseInt(cell.dataset.row);
    const c = parseInt(cell.dataset.col);
    
    if (gridData[r][c] === 2 || gridData[r][c] === 3) return;
    
    if (gridData[r][c] === 0) {
        gridData[r][c] = 1;
        cell.classList.add("wall");
    } else if (gridData[r][c] === 1) {
        gridData[r][c] = 0;
        cell.classList.remove("wall");
    }
}

async function runSortingAlgorithm() {
    const algo = document.getElementById("algorithmSelect").value;
    
    switch(algo) {
        case "bubble": await bubbleSort(); break;
        case "selection": await selectionSort(); break;
        case "insertion": await insertionSort(); break;
        case "merge": await mergeSort(0, arrayData.length - 1); break;
        case "quick": await quickSort(0, arrayData.length - 1); break;
    }
    
    await markAllSorted();
}

async function bubbleSort() {
    const bars = document.querySelectorAll(".bar");
    
    for (let i = 0; i < arrayData.length - 1; i++) {
        for (let j = 0; j < arrayData.length - i - 1; j++) {
            stats.comparisons++;
            updateStats();
            
            bars[j].classList.add("comparing");
            bars[j + 1].classList.add("comparing");
            await sleep(50);
            
            if (arrayData[j] > arrayData[j + 1]) {
                stats.swaps++;
                updateStats();
                
                bars[j].classList.add("swapping");
                bars[j + 1].classList.add("swapping");
                await sleep(50);
                
                [arrayData[j], arrayData[j + 1]] = [arrayData[j + 1], arrayData[j]];
                bars[j].style.height = arrayData[j] + "px";
                bars[j + 1].style.height = arrayData[j + 1] + "px";
                
                bars[j].classList.remove("swapping");
                bars[j + 1].classList.remove("swapping");
            }
            
            bars[j].classList.remove("comparing");
            bars[j + 1].classList.remove("comparing");
        }
        bars[arrayData.length - i - 1].classList.add("sorted");
    }
}

async function selectionSort() {
    const bars = document.querySelectorAll(".bar");
    
    for (let i = 0; i < arrayData.length - 1; i++) {
        let minIdx = i;
        
        for (let j = i + 1; j < arrayData.length; j++) {
            stats.comparisons++;
            updateStats();
            
            bars[j].classList.add("comparing");
            bars[minIdx].classList.add("comparing");
            await sleep(50);
            
            if (arrayData[j] < arrayData[minIdx]) {
                bars[minIdx].classList.remove("comparing");
                minIdx = j;
            } else {
                bars[j].classList.remove("comparing");
            }
        }
        
        if (minIdx !== i) {
            stats.swaps++;
            updateStats();
            
            bars[i].classList.add("swapping");
            bars[minIdx].classList.add("swapping");
            await sleep(50);
            
            [arrayData[i], arrayData[minIdx]] = [arrayData[minIdx], arrayData[i]];
            bars[i].style.height = arrayData[i] + "px";
            bars[minIdx].style.height = arrayData[minIdx] + "px";
            
            bars[i].classList.remove("swapping");
            bars[minIdx].classList.remove("swapping");
        }
        
        bars[minIdx].classList.remove("comparing");
        bars[i].classList.add("sorted");
    }
}

async function insertionSort() {
    const bars = document.querySelectorAll(".bar");
    bars[0].classList.add("sorted");
    
    for (let i = 1; i < arrayData.length; i++) {
        let key = arrayData[i];
        let j = i - 1;
        
        bars[i].classList.add("comparing");
        await sleep(50);
        
        while (j >= 0 && arrayData[j] > key) {
            stats.comparisons++;
            stats.swaps++;
            updateStats();
            
            bars[j].classList.add("swapping");
            bars[j + 1].classList.add("swapping");
            await sleep(50);
            
            arrayData[j + 1] = arrayData[j];
            bars[j + 1].style.height = arrayData[j + 1] + "px";
            
            bars[j].classList.remove("swapping");
            bars[j + 1].classList.remove("swapping");
            j--;
        }
        
        arrayData[j + 1] = key;
        bars[j + 1].style.height = key + "px";
        bars[i].classList.remove("comparing");
        
        for (let k = 0; k <= i; k++) {
            bars[k].classList.add("sorted");
        }
    }
}

async function mergeSort(left, right) {
    if (left >= right) return;
    
    const mid = Math.floor((left + right) / 2);
    await mergeSort(left, mid);
    await mergeSort(mid + 1, right);
    await merge(left, mid, right);
}

async function merge(left, mid, right) {
    const bars = document.querySelectorAll(".bar");
    const leftArr = arrayData.slice(left, mid + 1);
    const rightArr = arrayData.slice(mid + 1, right + 1);
    
    let i = 0, j = 0, k = left;
    
    while (i < leftArr.length && j < rightArr.length) {
        stats.comparisons++;
        updateStats();
        
        bars[k].classList.add("comparing");
        await sleep(50);
        
        if (leftArr[i] <= rightArr[j]) {
            arrayData[k] = leftArr[i++];
        } else {
            arrayData[k] = rightArr[j++];
        }
        
        stats.swaps++;
        updateStats();
        bars[k].style.height = arrayData[k] + "px";
        bars[k].classList.remove("comparing");
        k++;
    }
    
    while (i < leftArr.length) {
        arrayData[k] = leftArr[i++];
        bars[k].style.height = arrayData[k] + "px";
        stats.swaps++;
        updateStats();
        k++;
    }
    
    while (j < rightArr.length) {
        arrayData[k] = rightArr[j++];
        bars[k].style.height = arrayData[k] + "px";
        stats.swaps++;
        updateStats();
        k++;
    }
}

async function quickSort(low, high) {
    if (low < high) {
        const pi = await partition(low, high);
        await quickSort(low, pi - 1);
        await quickSort(pi + 1, high);
    }
}

async function partition(low, high) {
    const bars = document.querySelectorAll(".bar");
    const pivot = arrayData[high];
    let i = low - 1;
    
    for (let j = low; j < high; j++) {
        stats.comparisons++;
        updateStats();
        
        bars[j].classList.add("comparing");
        bars[high].classList.add("comparing");
        await sleep(50);
        
        if (arrayData[j] < pivot) {
            i++;
            stats.swaps++;
            updateStats();
            
            bars[i].classList.add("swapping");
            bars[j].classList.add("swapping");
            await sleep(50);
            
            [arrayData[i], arrayData[j]] = [arrayData[j], arrayData[i]];
            bars[i].style.height = arrayData[i] + "px";
            bars[j].style.height = arrayData[j] + "px";
            
            bars[i].classList.remove("swapping");
            bars[j].classList.remove("swapping");
        }
        
        bars[j].classList.remove("comparing");
        bars[high].classList.remove("comparing");
    }
    
    stats.swaps++;
    updateStats();
    [arrayData[i + 1], arrayData[high]] = [arrayData[high], arrayData[i + 1]];
    bars[i + 1].style.height = arrayData[i + 1] + "px";
    bars[high].style.height = arrayData[high] + "px";
    
    return i + 1;
}

async function markAllSorted() {
    const bars = document.querySelectorAll(".bar");
    for (let bar of bars) {
        bar.classList.add("sorted");
        await sleep(20);
    }
}

async function runSearchingAlgorithm() {
    const algo = document.getElementById("algorithmSelect").value;
    
    if (algo === "linear") {
        await linearSearch();
    } else {
        arrayData.sort((a, b) => a - b);
        const items = document.querySelectorAll(".search-item");
        items.forEach((item, i) => {
            item.textContent = arrayData[i];
        });
        await sleep(500);
        await binarySearch();
    }
}

async function linearSearch() {
    const items = document.querySelectorAll(".search-item");
    
    for (let i = 0; i < arrayData.length; i++) {
        stats.comparisons++;
        updateStats();
        
        items[i].classList.add("checking");
        await sleep(200);
        
        if (arrayData[i] === searchTarget) {
            items[i].classList.remove("checking");
            items[i].classList.add("found");
            return;
        }
        
        items[i].classList.remove("checking");
    }
}

async function binarySearch() {
    const items = document.querySelectorAll(".search-item");
    let left = 0, right = arrayData.length - 1;
    
    while (left <= right) {
        stats.comparisons++;
        updateStats();
        
        const mid = Math.floor((left + right) / 2);
        
        items[mid].classList.add("checking");
        await sleep(300);
        
        if (arrayData[mid] === searchTarget) {
            items[mid].classList.remove("checking");
            items[mid].classList.add("found");
            return;
        }
        
        if (arrayData[mid] < searchTarget) {
            left = mid + 1;
        } else {
            right = mid - 1;
        }
        
        items[mid].classList.remove("checking");
    }
}

async function runPathfinding() {
    const algo = document.getElementById("algorithmSelect").value;
    const cells = document.querySelectorAll(".cell");
    
    cells.forEach(cell => {
        cell.classList.remove("visited", "path");
    });
    
    if (algo === "bfs") {
        await bfs();
    } else {
        await dfs();
    }
}

async function bfs() {
    const queue = [[startCell.row, startCell.col]];
    const visited = Array(gridRows).fill().map(() => Array(gridCols).fill(false));
    const parent = Array(gridRows).fill().map(() => Array(gridCols).fill(null));
    
    visited[startCell.row][startCell.col] = true;
    
    const dirs = [[0, 1], [1, 0], [0, -1], [-1, 0]];
    
    while (queue.length > 0) {
        const [r, c] = queue.shift();
        
        if (r === endCell.row && c === endCell.col) {
            await drawPath(parent);
            return;
        }
        
        for (const [dr, dc] of dirs) {
            const nr = r + dr, nc = c + dc;
            
            if (nr >= 0 && nr < gridRows && nc >= 0 && nc < gridCols && 
                !visited[nr][nc] && gridData[nr][nc] !== 1) {
                
                visited[nr][nc] = true;
                parent[nr][nc] = [r, c];
                queue.push([nr, nc]);
                
                stats.comparisons++;
                updateStats();
                
                if (gridData[nr][nc] !== 3) {
                    const cell = document.querySelector(`[data-row="${nr}"][data-col="${nc}"]`);
                    cell.classList.add("visited");
                    await sleep(10);
                }
            }
        }
    }
}

async function dfs() {
    const stack = [[startCell.row, startCell.col]];
    const visited = Array(gridRows).fill().map(() => Array(gridCols).fill(false));
    const parent = Array(gridRows).fill().map(() => Array(gridCols).fill(null));
    
    visited[startCell.row][startCell.col] = true;
    
    const dirs = [[0, 1], [1, 0], [0, -1], [-1, 0]];
    
    while (stack.length > 0) {
        const [r, c] = stack.pop();
        
        if (r === endCell.row && c === endCell.col) {
            await drawPath(parent);
            return;
        }
        
        for (const [dr, dc] of dirs) {
            const nr = r + dr, nc = c + dc;
            
            if (nr >= 0 && nr < gridRows && nc >= 0 && nc < gridCols && 
                !visited[nr][nc] && gridData[nr][nc] !== 1) {
                
                visited[nr][nc] = true;
                parent[nr][nc] = [r, c];
                stack.push([nr, nc]);
                
                stats.comparisons++;
                updateStats();
                
                if (gridData[nr][nc] !== 3) {
                    const cell = document.querySelector(`[data-row="${nr}"][data-col="${nc}"]`);
                    cell.classList.add("visited");
                    await sleep(10);
                }
            }
        }
    }
}

async function drawPath(parent) {
    let curr = [endCell.row, endCell.col];
    
    while (curr && !(curr[0] === startCell.row && curr[1] === startCell.col)) {
        const [r, c] = curr;
        
        if (!(r === endCell.row && c === endCell.col)) {
            const cell = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
            cell.classList.add("path");
            stats.swaps++;
            updateStats();
            await sleep(30);
        }
        
        curr = parent[r][c];
    }
}
